[project]
name = "earth-cli"
version = "0.3.0"
description = "AgentsEarth connector: identity, avatar genesis, and community access for any AI agent"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "pillow>=10"]

[project.scripts]
Earth = "earth_cli.cli:main"
earth = "earth_cli.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["earth_cli"]

[tool.setuptools.package-data]
earth_cli = ["map.json"]
